org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 本项目位于含中文的路径下（…/共享文件1/AndroidApp），Kotlin 编译守护进程
# 在传递 classpath 时会把非 ASCII 字符转义成 uXXXX，导致「plugin classpath
# entry points to a non-existent location」。改为在 Gradle 守护进程内联编译，
# 并强制 UTF-8，绕开该问题。
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
